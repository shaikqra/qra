name: Tests

# Runs the compliance-critical test suite on every push and pull request.
# If any test goes red, GitHub flags the commit before it can reach production.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # matches local; native TypeScript test execution needs Node >= 23.6
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
